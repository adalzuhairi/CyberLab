---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade packages
  apt:
    upgrade: dist

- name: Install common packages
  apt:
    name:
      - vim
      - curl
      - wget
      - git
      - unzip
      - htop
      - net-tools
      - qemu-guest-agent
    state: present
    update_cache: yes

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Start QEMU Guest Agent
  systemd:
    name: qemu-guest-agent
    state: started

- name: Set timezone
  community.general.timezone:
    name: Europe/Brussels
