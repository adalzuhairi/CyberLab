---
- name: Create Runner directory
  file:
    path: "{{ runner_dir }}"
    state: directory
    mode: "0755"

- name: Create Runner data directory
  file:
    path: "{{ runner_dir }}/data"
    state: directory
    mode: "0755"

- name: Deploy config.yaml
  template:
    src: config.yaml.j2
    dest: "{{ runner_dir }}/data/config.yaml"
    mode: "0644"

- name: Copy docker-compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ runner_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy Runner
  community.docker.docker_compose_v2:
    project_src: "{{ runner_dir }}"
    state: present
    recreate: always
