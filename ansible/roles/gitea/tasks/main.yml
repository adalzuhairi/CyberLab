---
- name: Create Gitea directory
  file:
    path: "{{ gitea_dir }}"
    state: directory
    mode: "0755"

- name: Create data directory
  file:
    path: "{{ gitea_dir }}/data"
    state: directory
    mode: "0755"

- name: Copy docker-compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_dir }}/docker-compose.yml"

- name: Deploy Gitea
  community.docker.docker_compose_v2:
    project_src: "{{ gitea_dir }}"
